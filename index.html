<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>from.1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="fullcontent">
   <h1>University Registtration from</h1>
   <p class="Please">Please fill out the from</p>
   <hr>

   <form>
     <h2 class="Personal">Personal Details</h2>
   
     <label for="name">First Name:</label>
     <input type="text" name="name" id="name" placeholder="e.g:" required>
     <br><br>

     <label for="sirname">Last Name:</label>
     <input type="text" name="sirname" id="lastname" placeholder="e.g:">
     <br><br>

     <label for="DOB">DOB</label>
     <input type="date" name="DOB" id="DOB">
     <br><br>

    <h3>Gender</h3>

    <label for="Male">Male</label>
    <input type="radio" name="gender" id="Male" value="Male">
    <br><br>

    <label for="Female">Female</label>
    <input type="radio" name="gender" id="Female" value="Female"> 
     <br><br>

     <label for="upload">Upload your photo</label>
     <br><br>
     <input type="file" name="upload" id="upload">
     <br><br>

     <h3>Upload your photo</h3>
       <input type="file" name="upload" id="upload">
       <hr>

       <h2>Contact Information</h2>
       <label for="Email">Email Address:</label>
       <input type="email" name="email" id="email">
       <br><br>

       <label for="phone">phone Number:</label>
       <input type="tel" name="phone" id="phone">
       <br><br>

       <label for="Address">Mailing Address</label>
       <br>
       <textarea name="Address" id="Address" rows="10" cols="30"></textarea>
       <hr>

       <h2>Academic Information</h2>
       <label for="course">Select your course:</label>
       <select name="course" id="course">
        <option value="CSE">CSE</option>
        <option value="ME">ME</option>
        <option value="CE">CE</option>
       </select>
       <br> 

       <h3>Extracurricular Activites</h3>

       <label for="sports">Sports</label>
       <input type="checkbox" name="interest" id="sports" value="sports">
       <br><br>

      <label for="Music">Music</label>
       <input type="checkbox" name="interest" id="Music" value="Music">
       <br><br>

         <label for="technology">Technology Clubs</label>
        <input type="checkbox" name="interest" id="technology" value="technology">
        <br><br>

          <label for="voluntering">Voluntering</label>
        <input type="checkbox" name="interest" id="voluntering" itemid="voluntering">
        <br><br>
        <hr>

        <h2>Create Your Account</h2>
        <label for="pass">Create password:</label>
        <input type="password" name="password" id="pass">
        <br><br>
         
        <label for="secr">Security answer:</label>
        <input type="text" name="Security" id="secr">
        <br><br>

        <label for="I agree">I argee to the terms and conditions.</label>
        <input type="radio" name="I argee to the terms and conditions" id="I agree">
        <hr>

        <button type="submit">Register</button>
        <button type="reset">Clear Form</button>
   
    
       


   </form>
   </div>
    
</body>
</html>
